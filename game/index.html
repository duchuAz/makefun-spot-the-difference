<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Keeper&#8217;s Greenhouse &#8212; a spot the difference game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080c10; }
  body { display: flex; align-items: center; justify-content: center; }
  /* The game paints a fixed 1280 by 480 canvas; this only scales it, so a screenshot of the page at
     that size is the game at its own resolution, one canvas pixel to one screen pixel. */
  #game { display: block; background: #080c10; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="480" aria-label="The Keeper's Greenhouse: two pictures of a greenhouse at night, side by side. Find the differences between them with the arrow keys and Enter, or with the mouse."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
